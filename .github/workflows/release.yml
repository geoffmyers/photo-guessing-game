# Generated by the development repository's publishing tooling from the
# project's declared release artifacts. Edit them there; a change made only
# here is overwritten by the next publish.
#
# Every push to main builds the artifacts and publishes a release tagged
# v<version>, unless that version is already released: raise the version
# to cut a new one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; raise the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos-app:
    name: macOS app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: photo-guessing-game
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          npm ci
          npm run build
          npx electron-builder --mac dir --arm64 --x64 --publish never -c.mac.identity=null
          # electron-builder 25 cannot ad-hoc sign, and Apple silicon runs nothing unsigned.
          for app in release/mac*/"Photo Guessing Game.app"; do
            case "$app" in *arm64*) arch=arm64 ;; *) arch=x64 ;; esac
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --verbose "$app"
            ditto -c -k --keepParent "$app" "$NAME-$VERSION-macos-$arch.zip"
          done
          ls "$NAME-$VERSION-macos-arm64.zip" "$NAME-$VERSION-macos-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-app
          path: "*.zip"
          if-no-files-found: error

  build-ios-app:
    name: iOS app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: photo-guessing-game
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          npm ci
          npm run build
          npx cap sync ios
          # The project shares no scheme, so build the target (Swift packages resolve either way).
          xcodebuild -project ios/App/App.xcodeproj -target App -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Release-iphoneos/App.app Payload/
          zip -qry "$NAME-$VERSION-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: build-ios-app
          path: "*.ipa"
          if-no-files-found: error

  build-android-app:
    name: Android app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: photo-guessing-game
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          npm ci
          npm run build
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME-$VERSION-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: build-android-app
          path: "*.apk"
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build-macos-app, build-ios-app, build-android-app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        run: |
          cat > notes.md <<'NOTES'
          **macOS app:** download the zip for your Mac (`arm64` for Apple silicon, `x64` for Intel), unzip it and move Photo Guessing Game.app to Applications. The app is ad-hoc signed, not notarized, so macOS blocks it the first time: right-click it and choose **Open**, or run `xattr -dr com.apple.quarantine "/Applications/Photo Guessing Game.app"`.

          **iOS (unsigned):** `photo-guessing-game-{version}-ios-unsigned.ipa` installs only after you sign it with your own Apple ID (Xcode or a sideloading tool).

          **Android:** `photo-guessing-game-{version}-android-debug.apk` is debug-signed: allow installs from unknown sources, then open it on the device.

          The web version has no download: build it with your own photos as the [README](https://github.com/geoffmyers/photo-guessing-game#installation) describes, or play the [demo](https://photo-guessing-game.geoffmyers.com).
          NOTES
          sed -i "s/{version}/$VERSION/g" notes.md
          ls -l assets
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes
